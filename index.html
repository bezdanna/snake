<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {
    background: #222;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
  }
  #score {
    font-size: 20px;
    margin-bottom: 10px;
  }
  canvas {
    background: #111;
    border: 2px solid #555;
  }
  #message {
    margin-top: 10px;
    font-size: 18px;
    min-height: 24px;
  }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="message"></div>

<script>
  const GRID_SIZE = 20;
  const CELL_SIZE = 20;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');

  let snake, direction, nextDirection, food, score, gameOver, speed, timer;

  function init() {
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = direction;
    score = 0;
    gameOver = false;
    speed = 150;
    scoreEl.textContent = 'Score: 0';
    messageEl.textContent = '';
    spawnFood();

    if (timer) clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function spawnFood() {
    let empty = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      for (let y = 0; y < GRID_SIZE; y++) {
        if (!snake.some(seg => seg.x === x && seg.y === y)) {
          empty.push({ x, y });
        }
      }
    }
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  function tick() {
    if (gameOver) return;

    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      return endGame();
    }
    // self collision
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = 'Score: ' + score;
      spawnFood();
      speedUp();
    } else {
      snake.pop();
    }

    draw();
  }

  function speedUp() {
    // gradually speed up as score increases, with a floor
    const newSpeed = Math.max(50, 150 - score * 5);
    if (newSpeed !== speed) {
      speed = newSpeed;
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }
  }

  function endGame() {
    gameOver = true;
    clearInterval(timer);
    messageEl.textContent = `Game over! Final score: ${score}. Press Space to restart.`;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // food
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

    // snake
    ctx.fillStyle = '#2ecc71';
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#27ae60' : '#2ecc71';
      ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (gameOver && e.code === 'Space') {
      init();
      return;
    }

    const key = e.key;
    let newDirection = null;

    if (key === 'ArrowUp') newDirection = { x: 0, y: -1 };
    else if (key === 'ArrowDown') newDirection = { x: 0, y: 1 };
    else if (key === 'ArrowLeft') newDirection = { x: -1, y: 0 };
    else if (key === 'ArrowRight') newDirection = { x: 1, y: 0 };
    else return;

    // prevent reversing directly into the neck
    const isOpposite = newDirection.x === -direction.x && newDirection.y === -direction.y;
    if (!isOpposite) {
      nextDirection = newDirection;
    }

    e.preventDefault();
  });

  init();
  draw();
</script>

</body>
</html>
